[seedbox]
type = sftp
host = ftl11.seedit4.me
user = seedit4me
port = 2113
# pass is deliberately not stored here. It is injected at runtime via
# RCLONE_CONFIG_SEEDBOX_PASS (from RCLONE_SEEDBOX_OBSCURED_PASS in .env).
# See rclone/README.md for how to set or rotate it.
md5sum_command = none
sha1sum_command = none
shell_type = none
disable_hashcheck = true
known_hosts_file = /config/known_hosts
